name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Lambda
        run: python -m compileall -q lambda tests
      - name: Build deployment package
        run: ./scripts/package.sh

  deploy-development:
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: test
    runs-on: ubuntu-latest
    environment: integration-hub-api-benefit-checker-api-development
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: Deploy Lambda code
        env:
          FUNCTION_NAME: ${{ vars.BENEFIT_ORCHESTRATOR_FUNCTION_NAME }}
          AUTHORIZER_FUNCTION_NAME: ${{ vars.REQUEST_AUTHORIZER_FUNCTION_NAME }}
        run: |
          ./scripts/package.sh
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME:-integration-hub-api-benefit-checker-api-benefit-orchestrator}" \
            --zip-file fileb://build/benefit-orchestrator.zip
          aws lambda update-function-code \
            --function-name "${AUTHORIZER_FUNCTION_NAME:-integration-hub-api-benefit-checker-api-authorizer}" \
            --zip-file fileb://build/request-authorizer.zip
